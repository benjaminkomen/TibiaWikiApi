name: API regression

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  api-regression:
    name: Fixture-backed goldens and docs smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: regression/.bun-version

      - name: Start fixture-backed API
        env:
          SPRING_PROFILES_ACTIVE: fixtures
          WIKI_FIXTURES_PATH: ${{ github.workspace }}/regression/fixtures
        run: |
          nohup ./gradlew bootRun --no-daemon --args='--spring.profiles.active=fixtures' \
            > boot-fixtures.log 2>&1 &
          echo $! > boot-fixtures.pid

      - name: Wait for localhost:8080
        id: wait
        run: bash regression/scripts/wait-for-api.sh

      - name: Smoke docs, OpenAPI 3.0, and health
        if: always() && steps.wait.outcome == 'success'
        working-directory: regression
        env:
          BASE_URL: http://localhost:8080
        run: bun run smoke:docs | tee ../regression-smoke-docs.log

      - name: Compare local API to goldens
        if: always() && steps.wait.outcome == 'success'
        working-directory: regression
        env:
          BASE_URL: http://localhost:8080
        run: bun run test | tee ../regression-test.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-regression-logs
          path: |
            boot-fixtures.log
            regression-smoke-docs.log
            regression-test.log

      - name: Stop API
        if: always()
        run: |
          if [ -f boot-fixtures.pid ]; then
            kill "$(cat boot-fixtures.pid)" || true
          fi
