# Merge-to-prod: tag $COMMIT_SHA and :latest, deploy with production env/probes,
# wait until the new revision is Ready, then smoke:docs against the revision URL
# (Swagger + actuator only — no wiki/Fandom paths). Live https://tibiawiki.dev
# smoke stays ops-only (scripts/deploy.sh); do not add it here or to PR CI.
#
# gcloud run deploy already sends 100% to the new revision once it is Ready.
# The previous `gcloud alpha run services update-traffic --to-latest` step is
# omitted on purpose: it is redundant after a successful deploy, and --to-latest
# can send traffic to latestCreated before Ready.
#
# Gradle image build + 36×10s startup probe + smoke needs more than the default
# 10m Cloud Build timeout.
#
# Image tags (issue #449): Cloud Run deploys $COMMIT_SHA. :latest is a pointer
# pushed only via images: after this build succeeds. cloudbuild-pr.yaml must
# not list these tags (it uses pr-$SHORT_SHA only).
# Unset Cloud Run knobs — do not guess; measure then set (issue #449):
#   cpu=1, concurrency=80, min-instances=0, timeout=300s, cpu-boost unset.
# Memory stays 1Gi until expand-cache metrics justify a change (issue #399).
timeout: 2400s

steps:
  # build the container image (jwiki is Maven Central; no GitHub Packages token)
  # $COMMIT_SHA comes from Cloud Build GitHub triggers. :latest is a pointer only.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tibiawikiapi:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/tibiawikiapi:latest'
      - '-f'
      - './docker/Dockerfile'
      - '.'

  # SHA tag must be in the registry before gcloud run deploy (images: pushes after steps).
  # Do not push :latest here — that would move the prod pointer even if Ready/smoke fails.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/tibiawikiapi:$COMMIT_SHA']

  # Deploy + Ready wait + bun smoke:docs against the revision URL.
  # Startup/liveness hit Actuator probe groups (no Fandom). Memory/concurrency
  # stay at 1Gi until expand-cache metrics justify a change (issue #399).
  # Flags live in scripts/cloud-run-release.sh (same path as scripts/deploy.sh).
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: bash
    env:
      - 'IMAGE=gcr.io/$PROJECT_ID/tibiawikiapi:$COMMIT_SHA'
      - 'PROJECT=$PROJECT_ID'
    args:
      - '-c'
      - |
        set -euo pipefail
        if ! command -v bun >/dev/null 2>&1; then
          echo "Installing bun for revision-URL smoke:docs (Swagger + actuator only)..."
          curl -fsSL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/bun.zip').extractall('/tmp/bun-extract')"
          BUN_BIN="$$(find /tmp/bun-extract -type f -name bun | head -n 1)"
          if [[ -z "$$BUN_BIN" ]]; then
            echo "ERROR: bun binary not found after download" >&2
            exit 1
          fi
          chmod +x "$$BUN_BIN"
          export PATH="$$(dirname "$$BUN_BIN"):$$PATH"
        fi
        bun --version
        ./scripts/cloud-run-release.sh
    timeout: 900s

# After a successful build only. Never list an untagged image (implicit :latest).
# cloudbuild-pr.yaml must not share these tags — see that file.
images:
  - 'gcr.io/$PROJECT_ID/tibiawikiapi:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/tibiawikiapi:latest'
