name: API regression

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  api-regression:
    name: Fixture-backed golden compare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Start fixture-backed API
        env:
          SPRING_PROFILES_ACTIVE: fixtures
          WIKI_FIXTURES_PATH: ${{ github.workspace }}/regression/fixtures
        run: |
          nohup ./gradlew bootRun --no-daemon --args='--spring.profiles.active=fixtures' \
            > boot-fixtures.log 2>&1 &
          echo $! > boot-fixtures.pid

      - name: Wait for localhost:8080
        run: bash regression/scripts/wait-for-api.sh

      - name: Compare local API to goldens
        working-directory: regression
        env:
          BASE_URL: http://localhost:8080
        run: bun run test | tee ../regression-test.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-logs
          path: |
            boot-fixtures.log
            regression-test.log

      - name: Stop API
        if: always()
        run: |
          if [ -f boot-fixtures.pid ]; then
            kill "$(cat boot-fixtures.pid)" || true
          fi
