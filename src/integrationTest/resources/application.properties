# This source set's application.properties shadows src/main/resources.
# Repeat settings the ITs need, then enable writes for existing PUT tests.
# Public Cloud Run stays off via WIKI_WRITE_ENABLED=false.
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
spring.jackson.use-jackson2-defaults=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.build.enabled=true
wiki.write.enabled=true
wiki.cors.allowed-origins=https://tibiawiki.dev,http://localhost:8080,http://127.0.0.1:8080
