[versions]
# Boot 4.1.1 BOM manages Kotlin 2.3.21; we pin 2.4.10 (Boot 4 requires 2.2+)
# and force it via resolutionStrategy in build.gradle.kts.
kotlin = "2.4.10"
spring-boot = "4.1.1"
sonarqube = "7.4.0.8496"
ktlint = "14.2.0"

# Aligned with the Spring Boot 4.1.1 BOM unless noted
slf4j = "2.0.18"
junit = "6.1.3"
jackson = "3.1.5"
jacoco = "0.8.15"
mockito = "5.23.0"
jwiki = "1.11.0"
json = "20260814"
guava = "33.7.1-jre"
vavr = "1.0.1"
hamcrest = "3.0"
springdoc = "3.1.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc", version.ref = "spring-boot" }
spring-boot-starter-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson", version.ref = "spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring-boot" }
jwiki = { module = "io.github.fastily:jwiki", version.ref = "jwiki" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
json = { module = "org.json:json", version.ref = "json" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
vavr = { module = "io.vavr:vavr", version.ref = "vavr" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test", version.ref = "spring-boot" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient", version.ref = "spring-boot" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
