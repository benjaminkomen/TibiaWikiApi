springdoc.api-docs.path=/api-docs
# Keep Jackson 3 defaults aligned with Boot 3.x / Jackson 2 for API payloads
spring.jackson.use-jackson2-defaults=true

# Health/info only. Do not expose env, heapdump, or other sensitive actuators.
# Probe groups stay process-local (liveness/readiness state) — no Fandom/wiki calls.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.build.enabled=true

# Public Cloud Run leaves writes off. Set WIKI_WRITE_ENABLED=true for a local/bot.
wiki.write.enabled=${WIKI_WRITE_ENABLED:false}
wiki.write.token=${WIKI_WRITE_TOKEN:}

# GET-only CORS for the Swagger UI origin and local bootRun. Set * to allow any GET origin.
wiki.cors.allowed-origins=${WIKI_CORS_ALLOWED_ORIGINS:https://tibiawiki.dev,http://localhost:8080,http://127.0.0.1:8080}

# Live Fandom client (ignored by the fixtures profile — that profile never constructs jwiki)
wiki.api-url=https://tibia.fandom.com/api.php
wiki.user-agent=TibiaWikiApi/2.0 (https://github.com/benjaminkomen/TibiaWikiApi; +https://tibiawiki.dev)
wiki.call-timeout=20s
wiki.init-failure-cooldown=5s
wiki.warm-on-startup=false
wiki.retry.max-attempts=3
wiki.retry.base-delay=200ms
wiki.retry.max-delay=2s
wiki.cache.ttl=60s
wiki.cache.max-category-entries=256
wiki.cache.max-article-entries=2048
wiki.expand.max-pages=5000
