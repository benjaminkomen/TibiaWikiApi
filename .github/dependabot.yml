version: 2
updates:
- package-ecosystem: gradle
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 5
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 5
- package-ecosystem: docker
  directory: "/docker"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 5
  ignore:
    # Stay on Java LTS: skip non-LTS Temurin majors (26-28, 30-32).
    # Patch/minor updates of 25 and the next LTS (29, then 33) still come through.
    # One single-operator requirement per major: GitHub drops comma-joined
    # ranges such as ">= 26, < 29" (not valid Bundler syntax), so they never
    # reach Dependabot. "~> 27.0" means ">= 27.0, < 28" and matches every tag
    # format (27_35-jre, 27.0.1_9-jre, 27-jre).
    - dependency-name: "eclipse-temurin"
      versions:
        - "~> 26.0"
        - "~> 27.0"
        - "~> 28.0"
        - "~> 30.0"
        - "~> 31.0"
        - "~> 32.0"
