steps:
  # build the container image (jwiki is Maven Central; no GitHub Packages token)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/tibiawikiapi', '-f', './docker/Dockerfile', '.']

  # push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/tibiawikiapi-246008/tibiawikiapi']


    # Deploy container image to Cloud Run
    # Startup/liveness hit Actuator probe groups (no Fandom). Memory/concurrency
    # stay at 1Gi until expand-cache metrics justify a change (issue #399).
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'tibiawikiapi', '--image', 'gcr.io/tibiawikiapi-246008/tibiawikiapi', '--region', 'europe-west1', '--platform', 'managed', '--memory', '1Gi', '--project', 'tibiawikiapi-246008', '--update-env-vars', 'LOGGING_JSON=true,WIKI_WRITE_ENABLED=false', '--startup-probe=httpGet.path=/actuator/health/readiness,timeoutSeconds=4,periodSeconds=10,failureThreshold=36', '--liveness-probe=httpGet.path=/actuator/health/liveness,timeoutSeconds=4,periodSeconds=30,failureThreshold=3', '--quiet']

    # Serve traffic from new revision
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['alpha', 'run', 'services', 'update-traffic', 'tibiawikiapi', '--region', 'europe-west1', '--platform', 'managed', '--to-latest']

images:
  - gcr.io/tibiawikiapi-246008/tibiawikiapi
