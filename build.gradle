buildscript {
    ext {
        // Latest OSS-supported Boot line as of Aug 2026 (Spring Framework 7 / Jakarta EE 11)
        springBootVersion = '4.1.1'
        // Boot 4.1.1 BOM manages Kotlin 2.3.21 (Boot 4 requires Kotlin 2.2+)
        kotlinVersion = '2.3.21'
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'jacoco'
    id "org.sonarqube" version "7.4.0.8496"
    id "org.jetbrains.kotlin.jvm" version "${kotlinVersion}"
    id "org.jetbrains.kotlin.plugin.spring" version "${kotlinVersion}"
    id "org.jlleitschuh.gradle.ktlint" version "14.2.0"
}

apply plugin: 'org.springframework.boot'

group = 'com.tibiawiki'
version = '2.0.0'
description = 'TibiaWikiApi'
//sourceCompatibility = '16'

repositories {
    mavenLocal()
    mavenCentral()

//    maven {
//        url = 'https://maven.pkg.github.com/benjaminkomen/jwiki'
//        credentials {
//            username = 'benjaminkomen'
//            password = System.getenv("GITHUB_TOKEN")
//        }
//    }
}

ext {
    // Versions aligned with the Spring Boot 4.1.1 BOM unless noted
    slf4jVersion = '2.0.18'
    junitVersion = '6.0.3'
    lombokVersion = '1.18.46'
    jacksonVersion = '3.1.5'
    jacocoVersion = "0.8.15"
    mockitoVersion = "5.23.0"
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}"
    implementation "org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}"
    implementation "tools.jackson.module:jackson-module-kotlin:${jacksonVersion}"
    implementation "org.springframework.boot:spring-boot-starter:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-webmvc:${springBootVersion}"
    implementation "org.springframework.boot:spring-boot-starter-jackson:${springBootVersion}"
//    implementation "benjaminkomen:jwiki:2.2.0"
    implementation "io.github.fastily:jwiki:1.11.0"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "net.logstash.logback:logstash-logback-encoder:9.0"
    implementation "com.google.cloud:spring-cloud-gcp-starter-logging:8.1.0"
    implementation "org.codehaus.janino:janino:3.1.12"
    implementation "org.json:json:20260814"
    implementation "com.google.guava:guava:33.7.1-jre"
    implementation "io.vavr:vavr:1.0.1"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.hamcrest:hamcrest:3.0"
    testImplementation("org.springframework.boot:spring-boot-starter-webmvc-test:${springBootVersion}") {
        exclude group: 'com.vaadin.external.google', module: 'android-json'
    }
    testImplementation "org.springframework.boot:spring-boot-starter-restclient:${springBootVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

compileKotlin {
    compilerOptions {
        freeCompilerArgs.add("-Xjsr305=strict")
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
    }
}

compileTestKotlin {
    compilerOptions {
        freeCompilerArgs.add("-Xjsr305=strict")
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
    }
}

sonar {
    properties {
        property "sonar.projectName", "TibiaWikiApi"
        property "sonar.projectKey", "com.tibiawiki:TibiaWikiApi"
        property "sonar.organization", "benjaminkomen-github"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.sources", "src/main"
        property "sonar.tests", "src/test"
        property "sonar.java.coveragePlugin", "jacoco"
        property "sonar.coverage.jacoco.xmlReportPaths", "./build/reports/jacocoTestReport.xml"
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed", "standard_error"
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'com/tibiawiki/TibiaWikiApiApplication'
    }
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    integrationTestImplementation.extendsFrom implementation
    integrationTestImplementation.extendsFrom testImplementation
    all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion kotlinVersion
            }
        }
    }
}

springBoot {
    buildInfo()
}

idea {
    module {
        testSources.from(sourceSets.integrationTest.java.srcDirs)
        testResources.from(sourceSets.integrationTest.resources.srcDirs)
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs the integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    outputs.upToDateWhen { false }
    mustRunAfter test
}

check.dependsOn integrationTest

jacoco {
    toolVersion = "${jacocoVersion}"
}

jacocoTestReport {
    dependsOn check

    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file("reports/jacocoTestReport.xml")
    }
}
